[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts = 
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    -v
    -s

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
